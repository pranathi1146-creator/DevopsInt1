<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevopsInt - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body {
  min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  padding: 20px;
}
.card {
  background: rgba(255,255,255,0.95);
  width: 100%; max-width: 380px;
  padding: 35px 30px;
  border-radius: 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  text-align: center;
}
.logo {
  width: 68px; height: 68px; margin: 0 auto 12px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 50%;
  display: flex; justify-content: center; align-items: center;
  color: white; font-size: 30px; font-weight: 700;
  box-shadow: 0 8px 20px rgba(102,126,234,0.4);
}
.card h1 { font-size: 26px; color: #222; }
.card h1 span { color: #764ba2; }
.card p.subtitle { color: #777; font-size: 13.5px; margin: 6px 0 22px; }
.input-box { text-align: left; margin-bottom: 14px; }
.input-box label { font-size: 13px; font-weight: 600; color: #333; margin-left: 4px; }
.input-box input {
  width: 100%; padding: 13px 15px; margin-top: 6px;
  border: 1.5px solid #e5e5e5; border-radius: 12px;
  outline: none; font-size: 14px; background: #f9f9ff;
}
.input-box input:focus { border-color: #764ba2; background: white; box-shadow: 0 0 0 3px rgba(118,75,162,0.12); }
.row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin: 4px 0 18px; }
.row a { color: #764ba2; text-decoration: none; font-weight: 500; }
.btn {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white; font-size: 16px; font-weight: 600; cursor: pointer;
  box-shadow: 0 8px 20px rgba(118,75,162,0.35);
}
.btn:hover { transform: translateY(-1px); }
.divider { margin: 20px 0 14px; font-size: 12px; color: #999; }
.social { display: flex; gap: 10px; }
.social button { flex: 1; padding: 11px; border: 1px solid #eee; background: white; border-radius: 10px; cursor: pointer; font-weight: 500; }
.signup { margin-top: 18px; font-size: 13.5px; color: #555; }
.signup a { color: #764ba2; font-weight: 600; text-decoration: none; }
.footer { margin-top: 16px; font-size: 11.5px; color: #aaa; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">D</div>
  <h1>Devops<span>Int</span></h1>
  <p class="subtitle">Welcome back! Please login to continue</p>

  <div class="input-box">
    <label>Username</label>
    <input type="text" placeholder="Enter your username">
  </div>

  <div class="input-box">
    <label>Password</label>
    <input type="password" placeholder="Enter your password">
  </div>

  <div class="row">
    <label><input type="checkbox" checked> Remember me</label>
    <a href="#">Forgot Password?</a>
  </div>

  <button class="btn">Login</button>

  <div class="divider">OR CONTINUE WITH</div>

  <div class="social">
    <button>Google</button>
    <button>GitHub</button>
  </div>

  <p class="signup">Don't have an account? <a href="#">Sign Up</a></p>
  <p class="footer">Created by Akula Pranathi | DevopsInt | SCM Practice</p>
</div>

</body>
</html>
